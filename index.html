<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Szachy – Pełna Wersja</title>
<style>
  body { font-family: Arial; display: flex; gap: 20px; }
  #board { width: 480px; height: 480px; display: grid;
           grid-template-columns: repeat(8, 1fr);
           grid-template-rows: repeat(8, 1fr);
           border: 2px solid #000; }
  .square {
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; user-select: none; position: relative;
  }
  .white { background: #eee; }
  .black { background: #888; color: white; }
  .piece {
    font-size: 34px;
    cursor: grab;
  }
  .palette { display: flex; flex-wrap: wrap; width: 140px; }
  .palette div { width: 40px; height: 40px; display: flex;
                 align-items: center; justify-content: center;
                 border: 1px solid #000; margin: 2px; cursor: grab; }
  textarea { width: 350px; height: 200px; }
  button { margin-top: 10px; width: 200px; }
</style>
</head>
<body>

<div id="board"></div>

<div>
  <h3>Figury</h3>
  <div class="palette" id="palette"></div>

  <button id="recordBtn">Ustaw rozwiązanie</button>
  <button id="stopBtn">Zakończ nagrywanie</button>
  <button id="colorBtn">Ustaw kolor: white</button>

  <h3>JSON</h3>
  <textarea id="output"></textarea>
</div>

<script>
const board = document.getElementById("board");
const palette = document.getElementById("palette");
const output = document.getElementById("output");
const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const colorBtn = document.getElementById("colorBtn");

let recording = false;
let currentColor = "white";
let moves = [];
let pieces = {};
let draggedPiece = null;
let draggedFrom = null;

// figury
const symbols = ["♔","♕","♖","♗","♘","♙","♚","♛","♜","♝","♞","♟"];

symbols.forEach(s => {
  const d = document.createElement("div");
  d.textContent = s;
  d.className = "piece";
  d.draggable = true;
  d.addEventListener("dragstart", () => {
    draggedPiece = s;
    draggedFrom = null; 
  });
  palette.appendChild(d);
});

const files = ["a","b","c","d","e","f","g","h"];

// budowa planszy
for (let r = 1; r <= 8; r++) {
  for (let f = 0; f < 8; f++) {
    const sq = document.createElement("div");
    const id = files[f] + r;
    sq.id = id;
    sq.className = "square " + ((r + f) % 2 === 0 ? "white" : "black");

    sq.addEventListener("dragover", e => e.preventDefault());
    sq.addEventListener("drop", onDrop);

    board.appendChild(sq);
  }
}

function createPiece(symbol, squareId) {
  const el = document.createElement("div");
  el.className = "piece";
  el.textContent = symbol;
  el.draggable = true;

  el.addEventListener("dragstart", () => {
    draggedPiece = symbol;
    draggedFrom = squareId;
  });

  return el;
}

function onDrop(e) {
  e.preventDefault();
  const square = e.target.closest(".square");
  if (!square) return;

  const targetId = square.id;

  if (!draggedPiece) return;

  if (draggedFrom) {
    document.getElementById(draggedFrom).innerHTML = "";
    delete pieces[draggedFrom];
  }

  square.innerHTML = "";
  square.appendChild(createPiece(draggedPiece, targetId));

  pieces[targetId] = draggedPiece;

  if (recording && draggedFrom) {
    moves.push({
      player: currentColor === "white" ? "user" : "computer",
      from: draggedFrom,
      to: targetId,
      piece: draggedPiece
    });
  }

  draggedPiece = null;
  draggedFrom = null;

  updateJSON();
}

function updateJSON() {
  let lines = [];

  lines.push("{");
  lines.push(`  color: "${currentColor}",`);
  lines.push("  pieces: {");

  // figury
  for (const sq in pieces) {
    lines.push(`    ${sq}: "${pieces[sq]}",`);
  }

  if (Object.keys(pieces).length === 0) {
    lines.push("  },");
  } else {
    lines[lines.length - 1] = lines[lines.length - 1].replace(/,$/, "");
    lines.push("  },");
  }

  // moves
  lines.push("  moves: [");

  moves.forEach(m => {
    lines.push(
      `    { player: "${m.player}", from: "${m.from}", to: "${m.to}", piece: "${m.piece}" },`
    );
  });

  if (moves.length > 0) {
    lines[lines.length - 1] = lines[lines.length - 1].replace(/,$/, "");
  }

  lines.push("  ]");
  lines.push("}");

  output.value = lines.join("\n");
}


// START nagrywania
recordBtn.addEventListener("click", () => {
  recording = true;
  recordBtn.style.background = "#7f7";
  stopBtn.style.background = "";
});

// STOP nagrywania
stopBtn.addEventListener("click", () => {
  recording = false;
  recordBtn.style.background = "";
  stopBtn.style.background = "#f77";
  updateJSON();
});

// zmiana koloru gracza
colorBtn.addEventListener("click", () => {
  currentColor = currentColor === "white" ? "black" : "white";
  colorBtn.textContent = "Ustaw kolor: " + currentColor;
  updateJSON();
});

</script>
</body>
</html>
